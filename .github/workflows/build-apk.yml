name: Build APK

on:
  push:
    branches: [moonlight-noir]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.0.12077973

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"
          echo "ndk.dir=$ANDROID_HOME/ndk/${NDK_VERSION}" > local.properties

      # Signing: these repository secrets hold the key every build is signed with, so a new
      # APK installs as an update over the previous one. Without them every run gets a new
      # throwaway key and Android refuses the update (signature mismatch).
      - name: Decode signing key
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set; these APKs can't update an existing install"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          tasks="assembleNonRoot_gameDebug"
          # Release APKs (package com.limelight.noir) only for tagged releases
          if [ "${{ steps.signing.outputs.signed }}" = "true" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tasks="$tasks assembleNonRoot_gameRelease"
          fi
          ./gradlew $tasks --no-daemon --stacktrace

      - name: Collect APKs
        id: collect
        run: |
          version=$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          short_sha=$(git rev-parse --short HEAD)
          mkdir -p dist
          for apk in app/build/outputs/apk/nonRoot_game/*/*.apk; do
            name=$(basename "$apk" .apk)              # app-nonRoot_game-arm64-v8a-debug
            name=${name#app-nonRoot_game-}            # arm64-v8a-debug
            cp "$apk" "dist/artemis-${version}-${short_sha}-${name}.apk"
          done
          ls -l dist
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ steps.collect.outputs.short_sha }}
          path: dist/*.apk
          if-no-files-found: error

      # Every push to the main branch refreshes the "nightly" pre-release
      - name: Publish nightly pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/moonlight-noir'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly ${{ steps.collect.outputs.version }} (${{ steps.collect.outputs.short_sha }})" \
            --notes "Automatic build of ${GITHUB_SHA}. Install the arm64-v8a APK on most phones. Signed: ${{ steps.signing.outputs.signed }}."

      # Pushing a tag like v20.3.0 creates a normal release
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
